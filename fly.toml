# Fly.io — one image, four process groups (same pattern as digital-twin-akash):
#   api        — stateless, always-startable, auto-stops when idle
#   worker     — polls Prefect Cloud for ingest runs (outbound only, no ports)
#   clip       — the batch embedding lane: whole documents, from the workers
#   clip-query — the interactive lane: single embeds, from the api only
#
# The last two are the same image and the same command. Why they are two
# machines rather than one is measured, and the [processes] block says what the
# numbers were: a query embed queueing behind a document batch cost the read
# path 64ms -> 2788ms, peaking at 20397ms.
#
# Four groups is four machines, and all four bill while they run — two of them
# hold a 2GB model, and `api` is deliberately kept alive rather than scaled to
# zero (see min_machines_running below for the measurement behind that).
# `fly scale count clip=0 clip-query=0 worker=0` after a demo, or
# `fly apps destroy` when done with it.
#
# Bucket: `fly storage create` provisions Tigris and injects the AWS_* secrets
# automatically — then just `fly secrets set STORAGE_PROVIDER=flyio`.
#
# fly launch --no-deploy --copy-config
# Get-Content .env | Where-Object { $_ -match '^[A-Z_]+=.+' -and $_ -notmatch '^FLY_' } | fly secrets import
# fly deploy --ha=false
# fly scale count worker=2        # more ingest throughput, anytime

app = 'momentsearch-rbertus'
# Frankfurt, because that is where the data already is: Neon
# (…c-4.eu-central-1.aws.neon.tech) and Qdrant Cloud
# (…eu-central-1-0.aws.cloud.qdrant.io) both sit in AWS eu-central-1. One
# retrieve() makes two Qdrant calls and one Postgres call, and the ingest writes
# to both continuously — from iad every one of those crosses the Atlantic for
# ~90ms of round trip that buys nothing. Co-location with the stores beats
# co-location with the developer. (It also keeps the whole thing inside the EU,
# which is the house rule for anything that might ever hold personal data.)
primary_region = 'fra'

[build]

[deploy]
  # Startup gate: index the four sample talks BEFORE the new version goes live —
  # if it can't, the deploy aborts and the old version keeps serving, so users
  # never hit a half-indexed app. Runs in a temporary machine where the clip
  # service isn't up yet, so CLIP_SERVICE_URL= forces in-process embedding.
  # Idempotent + durable (Qdrant Cloud): real work happens only on first deploy.
  release_command = "sh -c 'CLIP_SERVICE_URL= python -m src.seed'"

[processes]
  # The api overrides CLIP_SERVICE_URL inline rather than taking the [env] one:
  # it embeds against the INTERACTIVE lane while the workers use the batch lane.
  # Measured locally with both on one instance and a 20-document backfill in
  # flight, the read path's embed_text went from a 64ms idle median to 2788ms,
  # peaking at 20397ms (318x) — a query embed waiting behind a document batch
  # inside one process. Splitting them took the retrieval median to 2.09x idle
  # and the search-during-ingest gate from unmeasurable to 1.12 (target 1.3).
  #
  # The split is worth more here than it was locally. On one laptop the lanes
  # still share twelve cores, so it had to be paid for with a cpu cap on the
  # batch side (docker-compose.yml). A process group is its own machine, so
  # here the capacity is bought rather than allocated and that cap has no
  # equivalent — do NOT port it.
  api = 'sh -c "CLIP_SERVICE_URL=http://clip-query.process.momentsearch-rbertus.internal:8001 uvicorn src.app:app --host 0.0.0.0 --port 8000"'
  worker = 'python -m src.worker'
  # Must bind IPv6 (::) — Fly private networking (*.internal, used by
  # CLIP_SERVICE_URL) is IPv6-only; 0.0.0.0 would be unreachable internally.
  clip = 'uvicorn src.clip_service:app --host :: --port 8001'
  # Same image, same command, no batch traffic: this one only ever serves
  # /embed/text and /embed/query, for the read path.
  clip-query = 'uvicorn src.clip_service:app --host :: --port 8001'

[env]
  # Fly private networking: <process>.process.<app>.internal resolves to the
  # clip machine. The WORKERS send their embed batches there (one warm model);
  # the api overrides this above. clip_service itself ignores it and always
  # runs the model locally.
  #
  # The app name now appears THREE times in this file: `app = '…'`, this line,
  # and the api's inline override. Renaming the app means changing all three.
  CLIP_SERVICE_URL = 'http://clip.process.momentsearch-rbertus.internal:8001'

# Infra backstop: if a machine's process ever exits (crash, OOM, a dependency
# outage that slips past the code's own retry loop), always bring it back —
# don't leave it stopped. The worker's serve() also self-heals in code
# (src/worker.py); this is defense in depth so a fresh clone survives blips.
[[restart]]
  policy = 'always'
  retries = 10
  processes = ['worker', 'clip', 'clip-query']

# api restarts only on failure — so its money-saving idle auto-stop isn't
# undone by the restart policy.
[[restart]]
  policy = 'on-failure'
  retries = 10
  processes = ['api']

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep ONE api machine alive. Scale-to-zero is cheaper and it costs the first
  # visitor the whole request: measured on this app, the proxy woke a stopped
  # machine at 13:32:51 and gave up after 15 attempts in 8.3s, while uvicorn
  # only bound at 13:33:05 — ~13s, because importing src.app pulls in torch and
  # fastembed. The caller does not get a slow 200, it gets a connection error;
  # eval.py scored app_up as 0 for exactly that reason, and every request after
  # it passed in ~230ms. Auto-start cannot fix this: the wait is the import, not
  # the boot. Until the heavy imports are deferred past the first bind, an
  # always-on api is the difference between "reachable" and "reachable if you
  # ask twice".
  min_machines_running = 1
  processes = ['api']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'        # embedding happens in the clip service, api stays thin
  processes = ['api']

[[vm]]
  size = 'shared-cpu-2x'
  # Runs are light now (download + ffmpeg; embedding is remote) — 2gb fits
  # WORKER_CONCURRENCY=2. Scale workers horizontally, not vertically.
  memory = '2gb'
  processes = ['worker']

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'          # the one warm CLIP model (~1.5gb loaded)
  processes = ['clip']

# The interactive lane. Same model, same size — what differs is what reaches it:
# single-text embeds of a few tens of milliseconds instead of whole-document
# batches. It stays warm and is never auto-stopped, because the latency it
# exists to protect is the latency of the first query after an idle period.
#
# This is the machine to scale when search slows down, and `clip` is the one to
# scale when ingest does. That they are now separately scalable IS the fix; a
# second replica was impossible locally (two copies of the runtime did not fit
# the memory Docker had), which is why the local version had to settle for a
# semaphore plus a cpu cap.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
  processes = ['clip-query']
