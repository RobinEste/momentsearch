# Continuous deployment to Fly.io on every push to dev.
# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Setup (once): create a deploy token and add it as a repo secret named
# FLY_API_TOKEN — Settings -> Secrets and variables -> Actions:
#   fly tokens create deploy -x 999999h
#
# On each push the release_command in fly.toml runs the sample seed gate first;
# if it fails the deploy aborts and the previous version keeps serving.
name: Fly Deploy
on:
  push:
    branches:
      - dev
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # only one deploy at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
